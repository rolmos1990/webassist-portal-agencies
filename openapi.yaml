openapi: 3.1.0
info:
    title: WAC API
    description: Api para uso interno WAC.
    version: 1.0.16
    contact:
        name: Pixel Media Publicidad
        url: https://www.pixelmedia.com.pa
        email: webmaster@weassistgroup.com
servers:
    - url: "https://dev.weassistgroup.com/admin/api"
      description: Dev server
    - url: "https://www.weassistgroup.com/admin/api"
      description: Production server
tags:
    - name: Generales
      description: Endpoints generales del sistema
    - name: Agentes
      description: Endpoints de agentes y agencias
    - name: Emisiones
      description: Endpoints de Emisiones de Vouchers
    - name: Renovaciones
      description: Endpoints para listado de renovaciones
    - name: Cobranding
      description: Endpoints para configuración de cobranding
    - name: Leads
      description: Endpoints para gestión de leads

paths:
    /idiomas:
        get:
            summary: Listado de Idiomas
            description: Los idiomas que tiene el Sitio
            operationId: getIdiomas
            tags:
                - Generales
            responses:
                "200":
                    description: Respuesta exitosa con los idiomas
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    ok:
                                        type: boolean
                                        example: true
                                    data:
                                        type: object
                                        additionalProperties:
                                            type: string
                                        example:
                                            es: "Español"
                                            en: "English"
                "400":
                    description: Bad Request
                "404":
                    description: Resource not found
    /{idioma}/lang_strings_version:
        get:
            summary: Última versión de las traducciones
            description: Muestra la última versión de las traducciones del idioma
            operationId: getLangStringsVersion
            tags:
                - Generales
            parameters:
                - name: idioma
                  in: path
                  required: true
                  schema:
                      type: string
                  description: El código del idioma
            responses:
                "200":
                    description: Respuesta exitosa con las traducciones y su versión
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    ok:
                                        type: boolean
                                        example: true
                                    data:
                                        type: object
                                        properties:
                                            version:
                                                type: string
                                                example: "1e02e983cb4b66157f12e503c0c55c9c"
                "400":
                    description: Bad Request
                "404":
                    description: Resource not found
    /{idioma}/lang_strings:
        get:
            summary: Traducciones
            description: Muestra las traducciones del idioma seleccionado
            operationId: getLangStrings
            tags:
                - Generales
            parameters:
                - name: idioma
                  in: path
                  required: true
                  schema:
                      type: string
                  description: El código del idioma
            responses:
                "200":
                    description: Respuesta exitosa con las Traducciones
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    ok:
                                        type: boolean
                                        example: true
                                    data:
                                        type: object
                                        additionalProperties:
                                            type: string
                                        example:
                                            slug_idioma: "es"
                                            idioma: "Español"
                                            meta_description: "We Assist es una compañía de asistencia..."
                                            derechos: "Todos los derechos Reservados © 2025 - We Assist Corp."
                                            info_contacto: "Información de contacto"
                                            # ...otros campos dinámicos...
                "400":
                    description: Bad Request
                "404":
                    description: Resource not found
    /{idioma}/status-codes:
        get:
            summary: Códigos de Estado
            description: Obtiene los diferentes códigos de estado utilizados en el sistema
            operationId: getStatusCodes
            tags:
                - Generales
            parameters:
                - name: idioma
                  in: path
                  required: true
                  schema:
                      type: string
                  description: El código del idioma
            responses:
                "200":
                    description: Códigos de estado obtenidos correctamente
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    ok:
                                        type: boolean
                                        example: true
                                    data:
                                        type: object
                                        properties:
                                            genericos:
                                                type: array
                                                items:
                                                    type: object
                                                    properties:
                                                        id:
                                                            type: integer
                                                        nombre:
                                                            type: string
                                            carritos:
                                                type: array
                                                items:
                                                    type: object
                                                    properties:
                                                        id:
                                                            type: integer
                                                        nombre:
                                                            type: string
                                            renovaciones:
                                                type: array
                                                items:
                                                    type: object
                                                    properties:
                                                        id:
                                                            type: integer
                                                        nombre:
                                                            type: string
                "400":
                    description: Bad Request
                "404":
                    description: Resource not found
    /{idioma}/documentos/{voucher}:
        get:
            summary: Documentos del voucher
            description: Devuelve los documentos del voucher entregado
            operationId: getDocumentosVoucher
            tags:
                - Emisiones
            parameters:
                - name: idioma
                  in: path
                  required: true
                  schema:
                      type: string
                  description: El código del idioma
                - name: voucher
                  in: path
                  required: true
                  schema:
                      type: string
                  description: El código del voucher
            responses:
                "200":
                    description: Respuesta exitosa con los documentos
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    ok:
                                        type: boolean
                                        example: true
                                    documentos:
                                        type: array
                                        items:
                                            type: object
                                            properties:
                                                nombre:
                                                    type: string
                                                voucher:
                                                    type: string
                                                    example: "A93-XXXX"
                                                pdf_vouchers:
                                                    type: object
                                                    properties:
                                                        es:
                                                            type: string
                                                            example: "https://www.weassistgroup.com/vouchers/voucher_A93-XXXX_es.pdf"
                                                        en:
                                                            type: string
                                                            example: "https://www.weassistgroup.com/vouchers/voucher_A93-XXXX_en.pdf"
                                                links_tarjetas_es:
                                                    type: array
                                                    items:
                                                        type: object
                                                        properties:
                                                            nombre:
                                                                type: string
                                                                example: "test user"
                                                            file:
                                                                type: string
                                                                example: "https://www.weassistgroup.com/vouchers/card_A93-XXXX_1_es.pdf"
                                                links_tarjetas_en:
                                                    type: array
                                                    items:
                                                        type: object
                                                        properties:
                                                            nombre:
                                                                type: string
                                                                example: "CESAR VILLALAZ"
                                                            file:
                                                                type: string
                                                                example: "https://www.weassistgroup.com/vouchers/card_A93-XXXX_1_en.pdf"
                                    user:
                                        $ref: "#/components/schemas/User"
                "400":
                    description: Bad Request
                "404":
                    description: Resource not found
    /{idioma}/buscar_voucher:
        get:
            summary: Buscar voucher
            description: Devuelve los documentos de la busqueda, se puede buscar por voucher o por una combinación de nombre + apellido + (pasaporte o fecha de nacimiento)
            operationId: getBuscarVoucher
            tags:
                - Emisiones
            parameters:
                - name: idioma
                  in: path
                  required: true
                  schema:
                      type: string
                  description: El código del idioma
                - name: nombre
                  in: query
                  required: false
                  schema:
                      type: string
                  description: El nombre del cliente
                - name: apellido
                  in: query
                  required: false
                  schema:
                      type: string
                  description: El apellido del cliente
                - name: pasaporte
                  in: query
                  required: false
                  schema:
                      type: string
                  description: El pasaporte del cliente
                - name: voucher
                  in: query
                  required: false
                  schema:
                      type: string
                  description: El número de voucher
                - name: fecha_nacimiento
                  in: query
                  required: false
                  schema:
                      type: string
                  description: La fecha de nacimiento del cliente (Formato dd/mm/yyyy)
            responses:
                "200":
                    description: Respuesta exitosa con los documentos
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    ok:
                                        type: boolean
                                        example: true
                                    documentos:
                                        type: array
                                        items:
                                            type: object
                                            properties:
                                                nombre:
                                                    type: string
                                                voucher:
                                                    type: string
                                                    example: "A93-XXXX"
                                                pdf_vouchers:
                                                    type: object
                                                    properties:
                                                        es:
                                                            type: string
                                                            example: "https://www.weassistgroup.com/vouchers/voucher_A93-XXXX_es.pdf"
                                                        en:
                                                            type: string
                                                            example: "https://www.weassistgroup.com/vouchers/voucher_A93-XXXX_en.pdf"
                                                links_tarjetas_es:
                                                    type: array
                                                    items:
                                                        type: object
                                                        properties:
                                                            nombre:
                                                                type: string
                                                                example: "test user"
                                                            file:
                                                                type: string
                                                                example: "https://www.weassistgroup.com/vouchers/card_A93-XXXX_1_es.pdf"
                                                links_tarjetas_en:
                                                    type: array
                                                    items:
                                                        type: object
                                                        properties:
                                                            nombre:
                                                                type: string
                                                                example: "CESAR VILLALAZ"
                                                            file:
                                                                type: string
                                                                example: "https://www.weassistgroup.com/vouchers/card_A93-XXXX_1_en.pdf"
                                    user:
                                        $ref: "#/components/schemas/User"
                "400":
                    description: Bad Request
                "404":
                    description: Resource not found

    /{idioma}/login:
        post:
            summary: Iniciar sesión
            description: Inicia la sesión de un agente
            operationId: postAgenteLogin
            tags:
                - Agentes
            parameters:
                - name: idioma
                  in: path
                  required: true
                  schema:
                      type: string
                  description: El código del idioma
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                user:
                                    type: string
                                    format: email
                                    description: El email del usuario
                                pw:
                                    type: string
                                    description: La contraseña del usuario
                                id_agencia:
                                    type: string
                                    description: ID de la agencia (opcional)
            responses:
                "200":
                    description: Respuesta exitosa con el token de acceso en el array data (token_api)
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    ok:
                                        type: boolean
                                        example: true
                                    data:
                                        $ref: "#/components/schemas/UserLogin"
                "400":
                    description: Bad Request
                "404":
                    description: Resource not found

    /{idioma}/logout:
        post:
            summary: Cerrar Sesión
            description: Cierra la sesión del usuario
            operationId: postLogout
            tags:
                - Agentes
            parameters:
                - name: idioma
                  in: path
                  required: true
                  schema:
                      type: string
                  description: El código del idioma
                - $ref: "#/components/parameters/userTokenHeader"
            responses:
                "200":
                    description: Sesión cerrada correctamente
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    ok:
                                        type: boolean
                                        example: true
                "400":
                    description: Bad Request
                "404":
                    description: Resource not found

    /{idioma}/reporte-ventas-agencia:
        get:
            summary: Reporte de ventas por agencia
            description: Reporte de ventas por agencia (mes actual)
            operationId: getReporteVentasAgencia
            tags:
                - Agentes
            parameters:
                - name: idioma
                  in: path
                  required: true
                  schema:
                      type: string
                  description: El código del idioma
                - $ref: "#/components/parameters/userTokenHeader"
            responses:
                "200":
                    description: Reporte de ventas exitoso
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ReporteVentasAgenciaResponse"
                "400":
                    description: Bad Request
                "404":
                    description: Resource not found

    /{idioma}/reporte-ventas-agencia/{mes_ano}:
        get:
            summary: Reporte de ventas por agencia (filtrado)
            description: Reporte de ventas por agencia filtrado por mes y año (MM-YYYY)
            operationId: getReporteVentasAgenciaFiltrado
            tags:
                - Agentes
            parameters:
                - name: idioma
                  in: path
                  required: true
                  schema:
                      type: string
                  description: El código del idioma
                - name: mes_ano
                  in: path
                  required: true
                  schema:
                      type: string
                      example: "08-2025"
                  description: Mes y año en formato MM-YYYY
                - $ref: "#/components/parameters/userTokenHeader"
            responses:
                "200":
                    description: Reporte de ventas exitoso
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ReporteVentasAgenciaResponse"
                "400":
                    description: Bad Request
                "404":
                    description: Resource not found

    /{idioma}/perfil:
        get:
            summary: Perfil de Agente
            description: Obtiene el perfil del usuario autenticado
            operationId: getPerfilAgente
            tags:
                - Agentes
            parameters:
                - name: idioma
                  in: path
                  required: true
                  schema:
                      type: string
                  description: El código del idioma
                - $ref: "#/components/parameters/userTokenHeader"
            responses:
                "200":
                    description: Perfil del usuario autenticado
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    ok:
                                        type: boolean
                                        example: true
                                    data:
                                        $ref: "#/components/schemas/UserLogin"
                "400":
                    description: Bad Request
                "404":
                    description: Resource not found
    /{idioma}/actualizar-idioma:
        post:
            summary: Actualizar Idioma del Agente
            description: Actualiza el idioma preferido del agente autenticado
            operationId: actualizarIdiomaAgente
            tags:
                - Agentes
            parameters:
                - name: idioma
                  in: path
                  required: true
                  schema:
                      type: string
                  description: El código del idioma actual
                - $ref: "#/components/parameters/userTokenHeader"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                idioma:
                                    type: string
                                    description: El nuevo código de idioma a establecer
                                    example: "es"
                            required:
                                - idioma
            responses:
                "200":
                    description: Idioma actualizado correctamente
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    ok:
                                        type: boolean
                                        example: true
                                    data:
                                        $ref: "#/components/schemas/UserLogin"
                "400":
                    description: Bad Request
                "404":
                    description: Resource not found
    /{idioma}/cobranding:
        post:
            summary: Configuración de una página de cobranding
            description: Devuelve la configuración de una página de cobranding para un idioma y URL específicos.
            operationId: getCobrandingConfig
            tags:
                - Cobranding
            parameters:
                - name: idioma
                  in: path
                  required: true
                  description: Idioma de la configuración.
                  schema:
                      type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                url:
                                    type: string
                                    description: URL para obtener la configuración de cobranding.
            responses:
                "200":
                    description: Respuesta exitosa
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    ok:
                                        type: boolean
                                    datos:
                                        type: object
                                        properties:
                                            id:
                                                type: string
                                                example: "1"
                                            agencia:
                                                type: string
                                                example: "123"
                                            agente:
                                                type: string
                                                example: "456"
                                            color1:
                                                type: string
                                                example: "#2370a9"
                                            color2:
                                                type: string
                                                example: "#bcd6f0"
                                            color3:
                                                type: string
                                                example: "#999999"
                                            color4:
                                                type: string
                                                example: "#0b0b8d"
                                            logo:
                                                type: string
                                                format: uri
                                                example: "https://example.com/logo.png"
                                            logo_size:
                                                type: string
                                                example: "ancho"
                                            fuente1:
                                                type: string
                                                example: "Fuente Principal"
                                            fuente2:
                                                type: string
                                                example: "Fuente Secundaria"
                                            icono:
                                                type: string
                                                example: "https://example.com/favicon.ico"
                                            meta_description:
                                                type: string
                                                example: "We Assist es una compañía de asistencia..."
                                            counter1_value:
                                                type: string
                                                example: "10"
                                            counter1_append:
                                                type: string
                                                example: "K"
                                            counter1_texto:
                                                type: string
                                                example: "Texto de contador 1"
                                            counter2_value:
                                                type: string
                                                example: "5"
                                            counter2_append:
                                                type: string
                                                example: "K"
                                            counter2_texto:
                                                type: string
                                                example: "Texto de contador 2"
                                            home_sec1_img:
                                                type: string
                                                format: uri
                                                example: "https://example.com/image1.webp"
                                            home_sec3_img1:
                                                type: string
                                                format: uri
                                                nullable: true
                                                example: null
                                            home_sec3_img2:
                                                type: string
                                                format: uri
                                                nullable: true
                                                example: null
                                            home_sec3_img3:
                                                type: string
                                                format: uri
                                                nullable: true
                                                example: null
                                            home_bg_form:
                                                type: string
                                                format: uri
                                                example: "https://example.com/image2.webp"
                                            telefono:
                                                type: string
                                                nullable: true
                                                example: null
                                            whatsapp:
                                                type: string
                                                example: "+123456789"
                                            email:
                                                type: string
                                                format: email
                                                example: "example@example.com"
                                            nombre:
                                                type: string
                                                example: "Nombre de la Agencia"
                                            dominio:
                                                type: string
                                                format: uri
                                                example: "https://example.com"
                                            home_titulo:
                                                type: string
                                                example: "Título Principal"
                                            home_subtitulo:
                                                type: string
                                                example: "Subtítulo Principal"
                                            home_cta1:
                                                type: string
                                                example: "Llamado a la acción"
                                            home_sec2_titulo:
                                                type: string
                                                example: "Título Sección 2"
                                            home_sec2_subtitulo:
                                                type: string
                                                example: "Subtítulo Sección 2"
                                            home_sec3_titulo:
                                                type: string
                                                example: "Título Sección 3"
                                            home_sec3_subtitulo1:
                                                type: string
                                                example: "Subtítulo 1"
                                            home_sec3_texto1:
                                                type: string
                                                example: "Texto 1"
                                            home_sec3_subtitulo2:
                                                type: string
                                                example: "Subtítulo 2"
                                            home_sec3_texto2:
                                                type: string
                                                example: "Texto 2"
                                            home_sec3_subtitulo3:
                                                type: string
                                                example: "Subtítulo 3"
                                            home_sec3_texto3:
                                                type: string
                                                example: "Texto 3"
                                            home_sec3_cta:
                                                type: string
                                                example: "Llamado a la acción 3"
                                            home_sec4_titulo:
                                                type: string
                                                example: "Título Sección 4"
                                            home_sec4_texto:
                                                type: string
                                                example: "Texto Sección 4"
                                            footer_col:
                                                type: string
                                                example: "<p>Texto del pie de página</p>"
                                            planes:
                                                type: array
                                                items:
                                                    type: string
                                                example: ["101", "102", "103"]
                                            tipos_planes:
                                                type: array
                                                items:
                                                    type: string
                                                example: ["1", "2", "3"]
                                            descripciones_tipos_planes:
                                                type: object
                                                description: Descripciones de cada tipo de plan, keyeado por ID del tipo de plan
                                                additionalProperties:
                                                    type: string
                                                example:
                                                    "1": "Descripción 1"
                                                    "2": "Descripción 2"
                                                    "3": "Descripción 3"
                "400":
                    description: Bad Request
                "404":
                    description: Resource not found
    /{idioma}/vouchers_master:
        get:
            summary: Vouchers Master
            description: Lista los vouchers master disponibles para el usuario autenticado
            operationId: getVouchersMaster
            tags:
                - Emisiones
            parameters:
                - name: idioma
                  in: path
                  required: true
                  schema:
                      type: string
                  description: El código del idioma
                - $ref: "#/components/parameters/userTokenHeader"
            responses:
                "200":
                    description: Listado de vouchers master
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    ok:
                                        type: boolean
                                        example: true
                                    data:
                                        type: array
                                        items:
                                            type: object
                                            properties:
                                                id:
                                                    type: integer
                                                    example: 3
                                                codigo:
                                                    type: string
                                                    example: "A93-A96-1"
                                                agencia:
                                                    type: string
                                                    example: "96"
                                                agente:
                                                    type: string
                                                    example: "443"
                                                plan:
                                                    type: string
                                                    example: "122"
                                                noches:
                                                    type: string
                                                    example: "300"
                                                noches_disponibles:
                                                    type: string
                                                    example: "282"
                                                precio:
                                                    type: string
                                                    example: "1011.00"
                                                costo_procesamiento:
                                                    type: string
                                                    example: "0.00"
                                                precio_dia:
                                                    type: string
                                                    example: "3.37"
                                                costo_dia:
                                                    type: string
                                                    example: "0.73"
                                                ts_ini:
                                                    type: string
                                                    example: "1736658000"
                                                ts_fin:
                                                    type: string
                                                    example: "1768193999"
                                                ts_creacion:
                                                    type: string
                                                    example: "1736372465"
                                                ts_emision:
                                                    type: string
                                                    example: "1736606274"
                                                comision_procesada:
                                                    type: string
                                                    example: "1"
                                                status:
                                                    type: string
                                                    example: "1"
                                        user:
                                            $ref: "#/components/schemas/UserLogin"
                "400":
                    description: Bad Request
                "404":
                    description: Resource not found

    /{idioma}/vouchers_master/{id_master}:
        get:
            summary: Detalle de Voucher Master
            description: Obtiene el detalle de un voucher master específico (los vouchers ya creados del master enviado)
            operationId: getVouchersMasterDetail
            tags:
                - Emisiones
            parameters:
                - name: idioma
                  in: path
                  required: true
                  schema:
                      type: string
                  description: El código del idioma
                - name: id_master
                  in: path
                  required: true
                  schema:
                      type: integer
                  description: ID del voucher master
                - $ref: "#/components/parameters/userTokenHeader"
            responses:
                "200":
                    description: Detalle del voucher master
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    ok:
                                        type: boolean
                                        example: true
                                    data:
                                        type: object
                                        properties:
                                            voucher:
                                                type: object
                                                properties:
                                                    id:
                                                        type: string
                                                        example: "3"
                                                    codigo:
                                                        type: string
                                                        example: "A93-XXX-1"
                                                    agencia:
                                                        type: string
                                                    agente:
                                                        type: string
                                                    plan:
                                                        type: string
